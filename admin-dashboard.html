<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검사 신청 관리 | Wellscore 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
<style>
/* =================================================================
   Wellscore — NAD+ 자가검사 웰니스 서비스
   피 한 방울(DBS)로 확인하는 세포 에너지 지표, NAD+.
   디자인 톤: 애플 제품 페이지의 절제된 여백과 타이포그래피 +
   혈액검사라는 소재에서 가져온 레드-앰버 액센트.
   ================================================================= */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  /* ---- Color ---- */
  --bg: #ffffff;
  --bg-soft: #f5f5f7;
  --bg-dark: #1d1d1f;
  --bg-dark-raised: #2a2a2d;

  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --text-on-dark: #f5f5f7;
  --text-on-dark-secondary: #a1a1a6;

  --border: #d2d2d7;
  --border-light: #e8e8ed;
  --border-on-dark: #424245;

  --red: #e8384f;
  --red-dark: #c92a3f;
  --red-tint: #fdeced;

  --amber: #ffb238;
  --amber-dark: #c8790a;
  --amber-tint: #fff4e0;

  --green: #2fb350;
  --green-tint: #e9f8ec;

  /* ---- Type ---- */
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* ---- Shape ---- */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 26px;
  --r-full: 999px;

  /* ---- Elevation ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,.10);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.16);

  --max: 1160px;
  --nav-h: 64px;
  --ease: cubic-bezier(.22,1,.36,1);
}

/* ---------------------------------- Reset ---------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  padding-top: var(--nav-h);
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: break-word;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.03em; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------------------------------- Layout ---------------------------------- */
.container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.section { padding: 128px 0; }
.section-soft { background: var(--bg-soft); }
.section-dark { background: var(--bg-dark); color: var(--text-on-dark); }
.section-tight { padding-top: 72px; padding-bottom: 72px; }

.section-head { max-width: 620px; margin-bottom: 64px; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
h2.section-title {
  font-size: clamp(1.9rem, 1.4rem + 2vw, 2.7rem);
  line-height: 1.2;
  margin-bottom: 18px;
}
.section-desc { font-size: 1.1rem; color: var(--text-secondary); max-width: 46ch; }
.section-dark .section-desc { color: var(--text-on-dark-secondary); }
.section-head.center .section-desc { margin-left: auto; margin-right: auto; }

@media (max-width: 768px) {
  .section { padding: 76px 0; }
  .section-head { margin-bottom: 44px; }
}

/* ---------------------------------- Buttons ---------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 26px;
  border-radius: var(--r-full);
  font-weight: 600; font-size: 1rem;
  transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  white-space: nowrap;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-dark { background: var(--bg-dark); color: #fff; }
.btn-dark:hover { background: #000; transform: translateY(-1px); }
.btn-light { background: #fff; color: var(--text); }
.btn-light:hover { background: var(--bg-soft); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--text); }
.section-dark .btn-outline { color: var(--text-on-dark); border-color: var(--border-on-dark); }
.section-dark .btn-outline:hover { border-color: var(--text-on-dark); }
.panel-dark .btn-outline { color: var(--text-on-dark); border-color: var(--border-on-dark); }
.panel-dark .btn-outline:hover { border-color: var(--text-on-dark); }
.btn-ghost { background: var(--bg-soft); color: var(--text); }
.btn-ghost:hover { background: var(--border-light); }
.btn-lg { padding: 17px 34px; font-size: 1.05rem; }
.btn-sm { padding: 9px 18px; font-size: 0.88rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; }

.text-link { font-weight: 600; color: var(--red); }
.text-link:hover { color: var(--red-dark); }

/* ---------------------------------- Nav ---------------------------------- */
.nav-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-h);
  background: rgba(255,255,255,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
.nav-header.scrolled { border-bottom-color: var(--border-light); }
.nav-container {
  max-width: var(--max); margin: 0 auto; padding: 0 24px; height: 100%;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 1.28rem; font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center; }
.logo::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex-shrink: 0; vertical-align: middle; margin-right: 8px; }
.logo span { color: var(--red); }
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text); }
.nav-links a.active { color: var(--red); }
.nav-links a:hover { color: var(--red); }
.nav-auth { display: flex; align-items: center; gap: 10px; }
.nav-link-plain { font-size: 0.92rem; font-weight: 500; padding: 9px 14px; }

.nav-mobile-toggle {
  display: none; width: 34px; height: 34px; position: relative; z-index: 1100;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.nav-mobile-toggle span {
  display: block; width: 20px; height: 2px; background: var(--text);
  transition: transform .25s var(--ease), opacity .2s ease;
}
.nav-mobile-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-mobile-toggle.active span:nth-child(2) { opacity: 0; }
.nav-mobile-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.nav-mobile-menu {
  display: none;
}

@media (max-width: 860px) {
  .nav-links { display: none; }
  .nav-auth .nav-link-plain, .nav-auth .btn { display: none; }
  .nav-mobile-toggle { display: flex; }
  .nav-mobile-menu {
    display: flex; flex-direction: column;
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
    background: #fff; padding: 12px 24px 40px; z-index: 1001;
    transform: translateY(-8px); opacity: 0; pointer-events: none;
    transition: transform .25s var(--ease), opacity .2s ease;
    overflow-y: auto;
  }
  .nav-mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .nav-mobile-menu a {
    display: block; padding: 16px 4px; font-size: 1.05rem; font-weight: 600;
    border-bottom: 1px solid var(--border-light);
  }
  .nav-mobile-menu .mobile-auth { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
}

/* ---------------------------------- Hero ---------------------------------- */
.hero {
  padding-top: 100px; padding-bottom: 96px;
  display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center;
}
.hero-copy .kicker { font-size: 1.05rem; font-weight: 600; color: var(--red); margin-bottom: 18px; }
.hero h1 {
  font-size: clamp(2.4rem, 1.7rem + 3vw, 3.75rem);
  line-height: 1.12;
  letter-spacing: -0.035em;
  margin-bottom: 22px;
  opacity: 0; transform: translateY(16px);
  animation: rise .7s var(--ease) forwards;
}
.hero p.lead {
  font-size: 1.2rem; color: var(--text-secondary); max-width: 42ch; margin-bottom: 34px;
  opacity: 0; transform: translateY(16px);
  animation: rise .7s var(--ease) .12s forwards;
}
.hero .btn-row { margin-bottom: 22px; opacity: 0; transform: translateY(16px); animation: rise .7s var(--ease) .24s forwards; }
.hero .fine-print { font-size: .88rem; color: var(--text-tertiary); opacity: 0; animation: rise .7s var(--ease) .34s forwards; }

@keyframes rise { to { opacity: 1; transform: translateY(0); } }

.hero-visual { position: relative; display: flex; align-items: center; justify-content: center; }
.hero-visual svg { width: 100%; max-width: 380px; height: auto; }
.drift-a { animation: drift 5s ease-in-out infinite; }
.drift-b { animation: drift 6.5s ease-in-out infinite .6s; }
.drift-c { animation: drift 5.5s ease-in-out infinite 1.1s; }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding-top: 64px; }
  .hero-copy .lead { margin-left: auto; margin-right: auto; }
  .hero .btn-row { justify-content: center; }
  .hero-visual { order: -1; margin-bottom: 8px; }
  .hero-visual svg { max-width: 260px; }
}

/* ---------------------------------- Feature row (plain, no cards) ---------------------------------- */
.feature-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.feature-item {
  padding: 8px 28px;
  border-left: 1px solid var(--border-light);
}
.feature-item:first-child { border-left: none; padding-left: 0; }
.feature-item .icon { color: var(--red); margin-bottom: 18px; }
.feature-item .icon svg { width: 26px; height: 26px; }
.feature-item h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
.feature-item p { font-size: .94rem; color: var(--text-secondary); }

@media (max-width: 860px) {
  .feature-row { grid-template-columns: 1fr 1fr; row-gap: 36px; }
  .feature-item:nth-child(3) { border-left: none; padding-left: 0; }
}
@media (max-width: 520px) {
  .feature-row { grid-template-columns: 1fr; }
  .feature-item { border-left: none; padding-left: 0; }
}
.feature-row-5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 860px) {
  .feature-row-5 { grid-template-columns: 1fr 1fr; }
  .feature-row-5 .feature-item:nth-child(3), .feature-row-5 .feature-item:nth-child(5) { border-left: none; padding-left: 0; }
}
@media (max-width: 520px) { .feature-row-5 { grid-template-columns: 1fr; } }

/* ---------------------------------- Two column content ---------------------------------- */
.split {
  display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center;
}
.split.reverse .split-visual { order: 2; }
.split p { color: var(--text-secondary); font-size: 1.06rem; margin-bottom: 20px; max-width: 50ch; }
.check-list { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.check-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 1rem; }
.check-list .icon { color: var(--green); flex-shrink: 0; margin-top: 2px; }
.check-list .icon svg { width: 20px; height: 20px; }

.split-visual { display: flex; justify-content: center; }
.split-visual svg { width: 100%; max-width: 340px; }

@media (max-width: 860px) {
  .split, .split.reverse { grid-template-columns: 1fr; gap: 40px; }
  .split.reverse .split-visual { order: -1; }
}

/* ---------------------------------- Steps (genuine sequence) ---------------------------------- */
.steps {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative;
}
.steps::before {
  content: ''; position: absolute; top: 23px; left: 60px; right: 60px; height: 1px;
  background: var(--border);
}
.step { position: relative; padding-right: 20px; }
.step .num {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--bg-dark); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.05rem; margin-bottom: 22px; position: relative; z-index: 1;
}
.step h3 { font-size: 1.08rem; margin-bottom: 8px; letter-spacing: -0.01em; }
.step p { font-size: .94rem; color: var(--text-secondary); }

@media (max-width: 860px) {
  .steps { grid-template-columns: 1fr; gap: 32px; }
  .steps::before { display: none; }
}
.steps-5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 860px) { .steps-5 { grid-template-columns: 1fr; } }

/* ---------------------------------- Report showcase (dark, the one bold moment) ---------------------------------- */
.showcase {
  display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;
}
.showcase-copy p { color: var(--text-on-dark-secondary); font-size: 1.08rem; max-width: 48ch; margin-bottom: 28px; }
.showcase-note { font-size: .85rem; color: var(--text-tertiary); margin-top: 18px; }

.gauge-card {
  background: var(--bg-dark-raised);
  border: 1px solid var(--border-on-dark);
  border-radius: var(--r-lg);
  padding: 40px 32px 32px;
}
.gauge-card .badge { margin-bottom: 20px; }
.gauge-wrap { display: flex; justify-content: center; margin-bottom: 4px; }
.gauge-wrap svg { width: 100%; max-width: 300px; }
.percentile-value { text-align: center; margin-top: 6px; }
.percentile-value .pct-headline { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
.percentile-value .pct-caption { font-size: .92rem; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }
.gauge-card .percentile-value .pct-headline { color: #fff; }
.gauge-card .percentile-value .pct-caption { color: var(--text-on-dark-secondary); }
.percentile-footnote { font-size: .78rem; color: var(--text-tertiary); text-align: center; margin-top: 16px; line-height: 1.6; }
.gauge-card .percentile-footnote { color: var(--text-on-dark-secondary); opacity: .8; }

.notice-box { display: flex; gap: 14px; align-items: flex-start; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px 22px; text-align: left; }
.notice-box .icon { color: var(--text-secondary); flex-shrink: 0; margin-top: 2px; }
.notice-box .icon svg { width: 20px; height: 20px; }
.notice-box p { font-size: .92rem; color: var(--text-secondary); line-height: 1.65; margin: 0; }
.notice-box strong { color: var(--text); font-weight: 700; }

/* ---------------------------------- Admin ---------------------------------- */
.admin-topbar { background: var(--bg-dark); padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.admin-topbar-inner { max-width: var(--max); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
.admin-logo { color: #fff; font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.admin-tag { background: var(--red); color: #fff; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: var(--r-full); }
.admin-topbar .btn-ghost { background: var(--bg-dark-raised); color: #fff; }
.admin-topbar .btn-ghost:hover { background: #3a3a3d; }

.admin-shell { max-width: 1100px; margin: 0 auto; padding: 40px 24px 100px; }
.admin-shell h1 { font-size: 1.8rem; margin-bottom: 6px; }
.admin-shell > p.sub { color: var(--text-secondary); margin-bottom: 32px; }

/* Admin Stats Cards */
.admin-stats-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
@media (max-width: 960px) { .admin-stats-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .admin-stats-grid { grid-template-columns: repeat(2, 1fr); } }

.stat-card {
  background: #fff;
  border: 1.5px solid var(--border-light);
  border-radius: var(--r-md);
  padding: 16px 14px;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  text-align: left;
}
.stat-card:hover {
  transform: translateY(-2px);
  border-color: var(--text);
  box-shadow: var(--shadow-sm);
}
.stat-card.active {
  border-color: var(--red);
  background: #fff8f8;
}
.stat-card .label { font-size: .78rem; color: var(--text-tertiary); font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
.stat-card .count { font-size: 1.55rem; font-weight: 800; color: var(--text); line-height: 1.1; }

/* Admin Tabs */
.admin-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 24px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.tab-btn {
  padding: 10px 18px;
  border-radius: var(--r-full);
  font-size: .92rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
  white-space: nowrap;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover { background: var(--bg-soft); color: var(--text); }
.tab-btn.active { background: var(--bg-dark); color: #fff; }

/* Filter & Search Bar */
.admin-filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  align-items: center;
  flex-wrap: wrap;
}
.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 260px;
}
.search-input-wrap input {
  width: 100%;
  padding: 11px 16px 11px 40px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-full);
  font-size: .92rem;
  background: #fff;
  transition: border-color .15s;
}
.search-input-wrap input:focus { border-color: var(--text); outline: none; }
.search-input-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  width: 17px;
  height: 17px;
  pointer-events: none;
}

/* Address Card & Inline Action Components */
.admin-addr-card {
  background: var(--bg-soft);
  border: 1px solid var(--border-light);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  font-size: .88rem;
  margin-top: 6px;
  line-height: 1.5;
}
.admin-addr-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.copy-badge-btn {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  font-size: .75rem;
  padding: 3px 9px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-secondary);
  transition: border-color .15s, color .15s;
  flex-shrink: 0;
}
.copy-badge-btn:hover { border-color: var(--text); color: var(--text); }
.tracking-inline-group {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
  flex-wrap: wrap;
}
.tracking-inline-group select, .tracking-inline-group input {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .82rem;
  background: #fff;
}
.tracking-inline-group input { width: 140px; }

.admin-section { margin-bottom: 40px; }
.admin-section h2 { font-size: 1.18rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.admin-empty { text-align: center; padding: 48px; color: var(--text-tertiary); border: 1px dashed var(--border); border-radius: var(--r-md); font-size: .92rem; }

.admin-table select { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 8px; font-size: .85rem; background: #fff; }
.admin-row-form { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: 26px; margin-top: 16px; }
.admin-row-form h3 { font-size: 1.05rem; margin-bottom: 4px; }
.admin-row-form .sub { color: var(--text-secondary); font-size: .88rem; margin-bottom: 20px; }
.admin-preview { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border-light); border-radius: var(--r-full); padding: 9px 18px; font-weight: 700; color: var(--red); margin-top: 4px; font-size: .95rem; }
.admin-field-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
@media (max-width: 600px) { .admin-field-row { grid-template-columns: 1fr; } }

/* Modals */
.admin-modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.admin-modal-backdrop.open { opacity: 1; pointer-events: auto; }
.admin-modal-card {
  background: #fff; border-radius: var(--r-lg); width: 100%; max-width: 540px;
  max-height: 90vh; overflow-y: auto; padding: 36px 32px;
  box-shadow: var(--shadow-lg); transform: translateY(12px) scale(.98);
  transition: transform .2s var(--ease);
}
.admin-modal-backdrop.open .admin-modal-card { transform: translateY(0) scale(1); }
.admin-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.admin-modal-header h3 { font-size: 1.25rem; font-weight: 800; }
.admin-modal-close { color: var(--text-tertiary); font-size: 1.5rem; line-height: 1; padding: 4px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; background: none; }
.admin-modal-close:hover { color: var(--text); }

@media (max-width: 860px) {
  .showcase { grid-template-columns: 1fr; gap: 40px; }
}

/* ---------------------------------- Pricing (plain, honest) ---------------------------------- */
.price-block {
  display: grid; grid-template-columns: auto 1fr; gap: 56px; align-items: start;
  padding-top: 8px;
}
.price-tag .original { font-size: 1.2rem; color: var(--text-tertiary); text-decoration: line-through; margin-bottom: 6px; }
.price-tag .amount { font-size: clamp(2.4rem, 1.8rem + 2.5vw, 4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 10px 12px; }
.price-tag .discount-badge { font-size: .85rem; font-weight: 700; color: var(--red); background: var(--red-tint); padding: 4px 12px; border-radius: var(--r-full); vertical-align: middle; white-space: nowrap; }
.price-tag .per { font-size: 1.05rem; color: var(--text-secondary); margin-top: 10px; }
.price-includes { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.price-includes li { display: flex; gap: 12px; align-items: flex-start; font-size: 1rem; color: var(--text); border-top: 1px solid var(--border-light); padding-top: 16px; }
.price-includes li:first-child { border-top: none; padding-top: 0; }
.price-includes .icon { color: var(--red); flex-shrink: 0; margin-top: 1px; }
.price-includes .icon svg { width: 20px; height: 20px; }
.price-cta { margin-top: 36px; }

@media (max-width: 700px) {
  .price-block { grid-template-columns: 1fr; gap: 28px; }
}

/* ---------------------------------- Coming soon (quiet inline banner) ---------------------------------- */
.coming-soon {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.coming-soon .text h3 { font-size: 1.1rem; margin-bottom: 6px; }
.coming-soon .text p { color: var(--text-secondary); font-size: .95rem; }
.tag {
  display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700;
  background: var(--bg-soft); color: var(--text-tertiary); padding: 5px 12px; border-radius: var(--r-full);
  flex-shrink: 0;
}

/* ---------------------------------- FAQ ---------------------------------- */
.faq-list { border-top: 1px solid var(--border-light); }
.faq-item { border-bottom: 1px solid var(--border-light); }
.faq-question {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 24px 4px; text-align: left; font-size: 1.05rem; font-weight: 600;
}
.faq-question .chev { flex-shrink: 0; color: var(--text-tertiary); transition: transform .25s var(--ease); }
.faq-item.open .faq-question .chev { transform: rotate(180deg); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height .3s var(--ease); }
.faq-item.open .faq-answer { max-height: 240px; }
.faq-answer p { padding: 0 4px 24px; color: var(--text-secondary); font-size: .98rem; max-width: 62ch; }

/* ---------------------------------- Closing CTA ---------------------------------- */
.cta-band { text-align: center; }
.cta-band h2 { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.4rem); margin-bottom: 28px; letter-spacing: -0.03em; }

/* ---------------------------------- Footer ---------------------------------- */
.site-footer { border-top: 1px solid var(--border-light); padding: 64px 0 32px; }
.footer-top { display: grid; grid-template-columns: 1.3fr 2fr; gap: 48px; margin-bottom: 48px; }
.footer-brand p { color: var(--text-secondary); font-size: .95rem; margin-top: 12px; max-width: 32ch; }
.footer-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.footer-col h4 { font-size: .85rem; color: var(--text-tertiary); font-weight: 600; margin-bottom: 16px; }
.footer-col a { display: block; font-size: .92rem; color: var(--text); margin-bottom: 12px; }
.footer-col a:hover { color: var(--red); }
.footer-bottom { border-top: 1px solid var(--border-light); padding-top: 28px; }
.footer-disclaimer { font-size: .82rem; color: var(--text-tertiary); line-height: 1.7; max-width: 80ch; margin-bottom: 16px; }
.footer-copy { font-size: .82rem; color: var(--text-tertiary); }

@media (max-width: 700px) {
  .footer-top { grid-template-columns: 1fr; gap: 32px; }
  .footer-links { grid-template-columns: repeat(3, 1fr); gap: 16px; }
}

/* =================================================================
   Auth pages (signup / login)
   ================================================================= */
.auth-shell {
  min-height: calc(100vh - var(--nav-h));
  display: flex; align-items: center; justify-content: center;
  padding: 56px 24px;
  background: var(--bg-soft);
}
.auth-card {
  width: 100%; max-width: 420px; background: #fff;
  border-radius: var(--r-lg); padding: 44px 36px;
  box-shadow: var(--shadow-md);
}
.auth-card .logo { display: block; text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
.auth-card h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
.auth-card .sub { text-align: center; color: var(--text-secondary); font-size: .95rem; margin-bottom: 32px; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 8px; }
.field input, .field textarea {
  width: 100%; padding: 13px 15px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: .98rem; transition: border-color .15s ease;
  background: #fff;
}
.field input:focus, .field textarea:focus { border-color: var(--text); outline: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 400px) { .field-row { grid-template-columns: 1fr; gap: 18px; } }
.field-hint { font-size: .8rem; color: var(--text-tertiary); margin-top: 6px; }

.checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; }
.checkbox-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--red); flex-shrink: 0; }
.checkbox-row label { font-size: .9rem; color: var(--text-secondary); }

.form-error {
  display: none; background: var(--red-tint); color: var(--red-dark);
  font-size: .88rem; font-weight: 500; padding: 12px 14px; border-radius: var(--r-sm); margin-bottom: 18px;
}
.form-note { text-align: center; font-size: .9rem; color: var(--text-secondary); margin-top: 22px; }
.auth-divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
.auth-divider span { font-size: .82rem; color: var(--text-tertiary); }

/* ---------------------------------- Address search row ---------------------------------- */
.field-with-btn { display: flex; gap: 10px; }
.field-with-btn input { flex: 1; }
.form-section-label { font-size: .8rem; font-weight: 700; color: var(--text-tertiary); margin: 26px 0 14px; }
.form-section-label:first-of-type { margin-top: 0; }
.radio-row { display: flex; gap: 20px; padding-top: 11px; }
.radio-option { display: flex; align-items: center; gap: 8px; font-size: .95rem; cursor: pointer; }
.radio-option input { width: 16px; height: 16px; accent-color: var(--red); margin: 0; }

/* =================================================================
   Dashboard (mypage)
   ================================================================= */
.dash-header { padding: 56px 0 32px; }
.dash-header h1 { font-size: 1.9rem; margin-bottom: 6px; }
.dash-header p { color: var(--text-secondary); }

.dash-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 24px; margin-bottom: 56px; align-items: stretch; }
.panel { border: 1px solid var(--border-light); border-radius: var(--r-md); padding: 28px; background: #fff; }
.panel-dark { background: var(--bg-dark); color: #fff; border: none; }
.voucher-count { font-size: 3rem; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 4px; }
.panel-dark .voucher-count { color: #fff; }
.panel-label { font-size: .88rem; color: var(--text-secondary); }
.panel-dark .panel-label { color: var(--text-on-dark-secondary); }
.panel .btn-row { margin-top: 22px; }
.no-voucher-msg { font-size: .88rem; color: var(--text-on-dark-secondary); margin-top: 14px; display: none; }

.panel-quick h3 { font-size: 1rem; margin-bottom: 16px; }
.quick-links { display: flex; flex-direction: column; gap: 4px; }
.quick-link {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 4px; border-bottom: 1px solid var(--border-light); font-size: .96rem; font-weight: 500;
}
.quick-link:last-child { border-bottom: none; }
.quick-link .icon { color: var(--text-tertiary); }
.quick-link .icon svg { width: 18px; height: 18px; }

@media (max-width: 780px) {
  .dash-grid { grid-template-columns: 1fr; }
}

.dash-section { margin-bottom: 56px; }
.dash-section h2 { font-size: 1.25rem; margin-bottom: 20px; }

.table-wrap { border: 1px solid var(--border-light); border-radius: var(--r-md); overflow: hidden; overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.data-table th, .data-table td { text-align: left; padding: 15px 20px; font-size: .92rem; }
.data-table th { background: var(--bg-soft); color: var(--text-tertiary); font-weight: 600; font-size: .8rem; }
.data-table tbody tr { border-top: 1px solid var(--border-light); }
.data-table .empty-row { text-align: center; color: var(--text-tertiary); padding: 36px 20px; }

@media (max-width: 640px) {
  table.data-table { min-width: 0; }
  .table-wrap { overflow-x: visible; }
  .data-table thead { display: none; }
  .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
  .data-table tbody tr { padding: 14px 18px; }
  .data-table td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border: none; text-align: right; }
  .data-table td[data-label]::before { content: attr(data-label); font-size: .78rem; font-weight: 600; color: var(--text-tertiary); text-align: left; }
  .data-table td.empty-row { display: block; text-align: center; padding: 32px 18px; }
  .data-table td.empty-row::before { content: none; }
}
.link-arrow { color: var(--red); font-weight: 600; }

.status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; padding: 5px 12px; border-radius: var(--r-full); }
.status-pending { background: var(--amber-tint); color: var(--amber-dark); }
.status-shipping { background: #e8f0fe; color: #1a56db; }
.status-return-req { background: #fff4e0; color: #c8790a; }
.status-return-ship { background: #eef2ff; color: #4338ca; }
.status-testing { background: #f1e8fe; color: #6b21db; }
.status-done { background: var(--green-tint); color: #1c8a3b; }

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-dark); color: #fff; padding: 15px 26px; border-radius: var(--r-full);
  font-size: .92rem; font-weight: 500; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none; transition: transform .3s var(--ease), opacity .3s ease;
  z-index: 2000; display: flex; align-items: center; gap: 10px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .icon { color: var(--green); }
.toast .icon svg { width: 18px; height: 18px; }

/* =================================================================
   Store / Checkout
   ================================================================= */
.store-shell { padding-top: 64px; padding-bottom: 100px; }
.store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.store-visual { display: flex; justify-content: center; }
.store-visual svg { width: 100%; max-width: 320px; }
.store-info h1 { font-size: 2.1rem; margin-bottom: 14px; }
.store-info .desc { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 28px; }

.qty-row { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
.qty-control { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--r-full); }
.qty-control button {
  width: 42px; height: 42px; font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.qty-control span { min-width: 32px; text-align: center; font-weight: 700; font-size: 1.05rem; }
.qty-total { font-size: 1rem; color: var(--text-secondary); }
.qty-total b { color: var(--text); font-size: 1.25rem; }

.included-list { display: flex; flex-direction: column; gap: 14px; margin: 28px 0; }
.included-list li { display: flex; gap: 12px; font-size: .96rem; }
.included-list .icon { color: var(--green); flex-shrink: 0; margin-top: 2px; }
.included-list .icon svg { width: 18px; height: 18px; }

.trust-row { display: flex; gap: 28px; margin-top: 32px; flex-wrap: wrap; }
.trust-row span { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-tertiary); }
.trust-row .icon svg { width: 16px; height: 16px; }

@media (max-width: 860px) {
  .store-grid { grid-template-columns: 1fr; gap: 36px; text-align: center; }
  .qty-row, .trust-row { justify-content: center; }
  .included-list { text-align: left; max-width: 340px; margin-left: auto; margin-right: auto; }
}

.checkout-shell { max-width: 560px; margin: 0 auto; padding: 72px 24px 100px; }
.checkout-shell h1 { font-size: 1.8rem; margin-bottom: 32px; }
.order-summary { border: 1px solid var(--border-light); border-radius: var(--r-md); padding: 24px; margin-bottom: 28px; }
.order-summary .row { display: flex; justify-content: space-between; padding: 12px 0; font-size: .96rem; }
.order-summary .row.total { border-top: 1px solid var(--border-light); margin-top: 8px; padding-top: 18px; font-weight: 700; font-size: 1.1rem; }
.order-summary .row span:first-child { color: var(--text-secondary); }
.order-summary .row.total span:first-child { color: var(--text); }

.pay-methods { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.pay-method { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 15px 16px; cursor: pointer; }
.pay-method input { accent-color: var(--red); width: 17px; height: 17px; }
.pay-method.checked { border-color: var(--text); }
.pay-method span { font-weight: 500; font-size: .96rem; }
.checkout-fineprint { text-align: center; font-size: .82rem; color: var(--text-tertiary); margin-top: 16px; }

/* =================================================================
   Kit request
   ================================================================= */
.request-shell { max-width: 560px; margin: 0 auto; padding: 72px 24px 100px; }
.request-shell h1 { font-size: 1.8rem; margin-bottom: 8px; }
.request-shell .sub { color: var(--text-secondary); margin-bottom: 36px; }
.request-shell .voucher-note { display: inline-flex; align-items: center; gap: 8px; background: var(--bg-soft); padding: 10px 16px; border-radius: var(--r-full); font-size: .9rem; font-weight: 600; margin-bottom: 32px; }
.no-voucher-block { display: none; text-align: center; padding: 48px 24px; border: 1px dashed var(--border); border-radius: var(--r-md); }
.no-voucher-block p { color: var(--text-secondary); margin-bottom: 20px; }

/* =================================================================
   Report page
   ================================================================= */
.report-shell { padding-top: 56px; padding-bottom: 100px; }
.report-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
.report-top h1 { font-size: 1.7rem; }
.badge-sample {
  display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700;
  background: var(--amber-tint); color: var(--amber-dark); padding: 6px 13px; border-radius: var(--r-full);
}
.badge-sample-dark { background: rgba(255,178,56,.16); color: var(--amber); }
.report-meta { display: flex; gap: 28px; flex-wrap: wrap; color: var(--text-secondary); font-size: .92rem; margin-bottom: 44px; padding-bottom: 32px; border-bottom: 1px solid var(--border-light); }
.report-meta div b { display: block; color: var(--text); font-weight: 600; margin-top: 2px; }

.report-main { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-bottom: 64px; }
.report-panel { border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: 36px; }
.report-panel h2 { font-size: 1.1rem; margin-bottom: 20px; }
.interp-text { color: var(--text-secondary); font-size: 1rem; margin-bottom: 16px; }
.interp-text:last-child { margin-bottom: 0; }

.trend-chart-wrap { margin-top: 4px; }
.trend-chart-wrap svg { width: 100%; height: auto; }
.trend-note { font-size: .82rem; color: var(--text-tertiary); margin-top: 12px; }

.tips-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 56px; }
.tip-card { border: 1px solid var(--border-light); border-radius: var(--r-md); padding: 24px; }
.tip-card .icon { color: var(--red); margin-bottom: 14px; }
.tip-card .icon svg { width: 22px; height: 22px; }
.tip-card h3 { font-size: .98rem; margin-bottom: 6px; }
.tip-card p { font-size: .88rem; color: var(--text-secondary); }

@media (max-width: 860px) {
  .report-main { grid-template-columns: 1fr; }
  .tips-grid { grid-template-columns: 1fr; }
}

/* =================================================================
   404
   ================================================================= */
.notfound { min-height: calc(100vh - var(--nav-h)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
.notfound .code { font-size: 5rem; font-weight: 800; color: var(--border); margin-bottom: 8px; }
.notfound h1 { font-size: 1.5rem; margin-bottom: 12px; }
.notfound p { color: var(--text-secondary); margin-bottom: 28px; }

<body style="padding-top:0;">

<header class="admin-topbar">
  <div class="admin-topbar-inner">
    <span class="admin-logo">Wellscore<span class="admin-tag">관리자</span></span>
    <div style="display:flex;align-items:center;gap:14px;">
      <span id="adminUserEmail" style="color:var(--text-on-dark-secondary);font-size:0.86rem;"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="adminLogoutBtn" onclick="handleLogout()" style="display:none;">로그아웃</button>
    </div>
  </div>
</header>

<main>
  <div class="admin-shell">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:8px;">
      <div>
        <h1>서비스 통합 운영 관리</h1>
        <p class="sub" style="margin-bottom:0;">키트 배송 출고, 고객 직접 반송 회수, 검체 분석 및 결과 리포트 발행까지 모든 업무를 관리해요.</p>
      </div>
      <button type="button" class="btn btn-outline btn-sm" onclick="renderDashboard()">새로고침</button>
    </div>

    <!-- 6대 핵심 업무 지표 통계 카드 -->
    <div class="admin-stats-grid" id="statsWrap" style="margin-top:24px;"></div>

    <!-- 업무별 탭 네비게이션 -->
    <div class="admin-tabs">
      <button type="button" class="tab-btn active" data-tab="all" onclick="switchTab('all')">📋 전체보기</button>
      <button type="button" class="tab-btn" data-tab="delivery" onclick="switchTab('delivery')">📦 배송 출고 관리 <span id="deliveryTabBadge" style="font-size:0.75rem;padding:2px 7px;background:var(--red-tint);color:var(--red);border-radius:var(--r-full);margin-left:4px;">0</span></button>
      <button type="button" class="tab-btn" data-tab="return" onclick="switchTab('return')">🔄 반송 회수 관리 <span id="returnTabBadge" style="font-size:0.75rem;padding:2px 7px;background:#fff4e0;color:#c8790a;border-radius:var(--r-full);margin-left:4px;">0</span></button>
      <button type="button" class="tab-btn" data-tab="testing" onclick="switchTab('testing')">🔬 검사 및 결과 등록 <span id="testingTabBadge" style="font-size:0.75rem;padding:2px 7px;background:#f1e8fe;color:#6b21db;border-radius:var(--r-full);margin-left:4px;">0</span></button>
      <button type="button" class="tab-btn" data-tab="completed" onclick="switchTab('completed')">✅ 완료된 리포트</button>

/* ---------- 나이대 계산 (생년월일 기반) ---------- */
function getAgeGroup(birthdateStr) {
  if (!birthdateStr) return '30대';
  const birth = new Date(birthdateStr);
  if (isNaN(birth.getTime())) return '30대';
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  let decade = Math.floor(age / 10) * 10;
  if (decade < 20) return '20대 미만';
  if (decade >= 70) return '70대 이상';
  return decade + '대';
}

/* ---------- NAD+ 참고 분포 및 퍼센타일 계산 ----------
   주의: 아래 평균(mean)/표준편차(sd)는 실제 임상 데이터가 아닌 예시 값이에요.
   실제 서비스에서는 공개된 연구 자료의 참고범위로 시작해서,
   자체 검사 데이터가 쌓이면 실제 분포로 점차 교체하는 걸 추천드려요. */
const NAD_REFERENCE = {
  '20대 미만': { mean: 45, sd: 9 },
  '20대': { mean: 42, sd: 8 },
  '30대': { mean: 38, sd: 8 },
  '40대': { mean: 34, sd: 8 },
  '50대': { mean: 30, sd: 7 },
  '60대': { mean: 27, sd: 7 },
  '70대 이상': { mean: 24, sd: 7 }
};
function normalCDF(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  let prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  if (z > 0) prob = 1 - prob;
  return prob;
}
function calculatePercentileTop(value, ageGroup) {
  const ref = NAD_REFERENCE[ageGroup] || NAD_REFERENCE['30대'];
  const z = (value - ref.mean) / ref.sd;
  const cdf = normalCDF(z);
  const topPercent = Math.round((1 - cdf) * 100);
  return Math.max(1, Math.min(99, topPercent));
}

/* ---------- 유틸 ---------- */
function formatDate(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}
function genId() {
  return 'NAD' + Date.now().toString(36).toUpperCase();
}

function escapeHtml(str) {

}

function statusToClass(status) {
  const map = {
    '배송준비중': 'pending',

  return map[status] || 'pending';

/* ---------- 클립보드 복사 ---------- */
function copyToClipboard(text, label) {
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast((label || '정보') + '가 클립보드에 복사되었어요.');
    }).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    showToast((label || '정보') + '가 클립보드에 복사되었어요.');
  } catch (err) {
    alert('복사에 실패했어요: ' + text);
  }
  document.body.removeChild(ta);
}

  } else if (activeTab === 'return') {

    filtered = allRequestsCache.filter(r => r.status === '검사중');
  } else if (activeTab === 'completed') {
    filtered = allRequestsCache.filter(r => r.status === '완료');
  }

  // 2. 검색어 필터
  if (searchKeyword) {
    filtered = filtered.filter(r => {
      const matchId = (r.id || '').toLowerCase().includes(searchKeyword);
      const matchCustomer = (r.customerName || '').toLowerCase().includes(searchKeyword);
      const matchRecipient = (r.recipientName || '').toLowerCase().includes(searchKeyword);
      const matchPhone = (r.recipientPhone || '').includes(searchKeyword) || (r.customerPhone || '').includes(searchKeyword);
      const matchAddr = ((r.address || '') + ' ' + (r.addressDetail || '')).toLowerCase().includes(searchKeyword);
      const matchReturnAddr = ((r.returnAddress || '') + ' ' + (r.returnAddressDetail || '')).toLowerCase().includes(searchKeyword);
      const matchTracking = (r.trackingNumber || '').toLowerCase().includes(searchKeyword) || (r.returnTrackingNumber || '').toLowerCase().includes(searchKeyword);
      return matchId || matchCustomer || matchRecipient || matchPhone || matchAddr || matchReturnAddr || matchTracking;
    });

  document.getElementById('searchCount').textContent = filtered.length;

  const container = document.getElementById('tabContentWrap');

  if (!filtered.length) {
    container.innerHTML = '<div class="admin-empty">해당 조건에 일치하는 신청 내역이 없어요.</div>';
    return;
  }

  if (activeTab === 'delivery') {
    renderDeliveryView(filtered, container);
  } else if (activeTab === 'return') {
    renderReturnView(filtered, container);
  } else if (activeTab === 'testing') {
    renderTestingView(filtered, container);
  } else if (activeTab === 'completed') {
    renderCompletedView(filtered, container);
  } else {
    renderAllView(filtered, container);
  }
}

/* =================================================================
   비즈니스 로직 함수들 (RPC 호출)
   ================================================================= */

/* 1. 배송 시작 / 송장 등록 */
async function saveDelivery(requestId) {
  const carrierEl = document.getElementById('carrier_' + requestId);
  const trackingEl = document.getElementById('tracking_' + requestId);
  const carrier = carrierEl ? carrierEl.value : 'CJ대한통운';
  const tracking = trackingEl ? trackingEl.value.trim() : '';

  const { error } = await sb.rpc('admin_update_delivery', {
    p_request_id: requestId,
    p_status: '배송중',
    p_carrier: carrier,
    p_tracking_number: tracking
  });

  if (error) {
    alert('배송 정보 저장 실패: ' + error.message);
    return;
  }
  showToast('배송 정보가 성공적으로 반영되었어요.');
  renderDashboard();
}

/* 2. 반송 송장 저장 */
async function saveReturn(requestId) {
  const carrierEl = document.getElementById('retCarrier_' + requestId);
  const trackingEl = document.getElementById('retTracking_' + requestId);
  const carrier = carrierEl ? carrierEl.value : 'CJ대한통운';
  const tracking = trackingEl ? trackingEl.value.trim() : '';

  const { error } = await sb.rpc('admin_update_return', {
    p_request_id: requestId,
    p_status: null,
    p_carrier: carrier,
    p_tracking_number: tracking
  });

  if (error) {
    alert('반송 정보 저장 실패: ' + error.message);
    return;
  }
  showToast('반송 송장 정보가 저장되었어요.');
  renderDashboard();
}

/* 3. 반송 수거중 처리 */
async function markAsReturnShipping(requestId) {
  const carrierEl = document.getElementById('retCarrier_' + requestId);
  const trackingEl = document.getElementById('retTracking_' + requestId);
  const carrier = carrierEl ? carrierEl.value : 'CJ대한통운';
  const tracking = trackingEl ? trackingEl.value.trim() : '';

  const { error } = await sb.rpc('admin_update_return', {
    p_request_id: requestId,
    p_status: '반송중',
    p_carrier: carrier,
    p_tracking_number: tracking
  });

  if (error) {
    alert('상태 변경 실패: ' + error.message);
    return;
  }
  showToast('반송중(회수 진행) 상태로 변경되었어요.');

}

/* 4. 검체 입고 확인 (검사중으로 전환) */
async function markAsTesting(requestId) {
  const { error } = await sb.rpc('admin_update_status', {
    p_request_id: requestId,
    p_status: '검사중'
  });

  if (error) {
    alert('상태 변경 실패: ' + error.message);
    return;
  }
  showToast('검체 입고가 확인되어 [검사중]으로 전환되었어요.');
  renderDashboard();
}

/* 5. 임의 상태 변경 */
async function changeStatus(requestId, newStatus) {
  const { error } = await sb.rpc('admin_update_status', { p_request_id: requestId, p_status: newStatus });
  if (error) {
    alert('상태 변경 중 문제가 발생했어요: ' + error.message);
    return;
  }
  showToast('신청 상태가 [' + newStatus + '](으)로 변경되었어요.');
  renderDashboard();
}

/* 6. 결과 입력 및 리포트 발행 모달 */
function openResultModal(requestId, customerName, ageGroup, currentValue) {
  currentModalRequestId = requestId;
  currentModalAgeGroup = ageGroup || '30대';

  const ref = NAD_REFERENCE[currentModalAgeGroup] || NAD_REFERENCE['30대'];
  document.getElementById('resultModalTitle').textContent = `검사 결과 입력 — ${customerName}님 (${currentModalAgeGroup})`;
  document.getElementById('resultModalClientInfo').innerHTML = `
    <strong>신청번호:</strong> ${escapeHtml(requestId)}<br>
    <strong>동년배 참고분포:</strong> ${currentModalAgeGroup} 그룹 (평균 ${ref.mean} μM, 표준편차 ${ref.sd})<br>
    입력하신 수치에 맞춰 동년배 대비 상위 백분위(%)가 자동 산출되어 고객 리포트로 발행됩니다.
  `;

  const inputEl = document.getElementById('resultValue');
  inputEl.value = (currentValue != null && currentValue !== '') ? currentValue : '';
  previewModalPercentile();

  openAdminModal('resultModal');
}

function previewModalPercentile() {
  const val = parseFloat(document.getElementById('resultValue').value);
  const previewEl = document.getElementById('resultModalPreview');
  if (isNaN(val)) {
    previewEl.innerHTML = '';
    return;
  }
  const pct = calculatePercentileTop(val, currentModalAgeGroup);
  previewEl.innerHTML = `
    <div style="background:var(--red-tint);color:var(--red-dark);padding:14px 18px;border-radius:var(--r-sm);font-weight:700;">
      산출 백분위: ${currentModalAgeGroup} 동년배 대비 <span style="font-size:1.25rem;color:var(--red);text-decoration:underline;">상위 ${pct}%</span>
      <div style="font-size:0.8rem;font-weight:400;margin-top:4px;color:var(--text-secondary);">
        * 상위 %가 작을수록 해당 연령대 평균보다 NAD+ 수치가 높은 편이에요.
      </div>
    </div>
  `;
}

async function submitModalResult() {
  const val = parseFloat(document.getElementById('resultValue').value);
  if (isNaN(val) || val <= 0) {
    alert('NAD+ 측정값을 0보다 큰 숫자로 올바르게 입력해주세요.');
    return;
  }

  const btn = document.getElementById('saveResultBtn');
  btn.disabled = true;
  btn.textContent = '리포트 발행 중...';

  const pct = calculatePercentileTop(val, currentModalAgeGroup);
  const { error } = await sb.rpc('admin_record_result', {
    p_request_id: currentModalRequestId,
    p_value: val,
    p_percentile: pct,
    p_age_group: currentModalAgeGroup
  });

  if (error) {
    alert('결과 저장 실패: ' + error.message);
    btn.disabled = false;
    btn.textContent = '저장하고 리포트 발행';
    return;
  }

  closeAdminModal('resultModal');
  btn.disabled = false;
  btn.textContent = '저장하고 리포트 발행';
  showToast('검사 결과가 등록되고 리포트가 발행되었어요.');
  renderDashboard();
}

/* ---------- 초기 로드 및 인증 체크 ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = 'login.html?redirect=admin';
    return;
  }
  if (user.role !== 'admin') {
    document.querySelector('.admin-shell').innerHTML = `
      <div class="admin-empty" style="padding:60px 24px;">
        <h3 style="margin-bottom:8px;font-size:1.3rem;">접근 권한이 없습니다</h3>
        <p style="color:var(--text-secondary);margin-bottom:24px;">관리자(admin) 권한을 가진 계정으로만 이용할 수 있습니다.</p>
        <a href="index.html" class="btn btn-dark">홈으로 돌아가기</a>
      </div>
    `;
    return;
  }

  document.getElementById('adminLogoutBtn').style.display = 'inline-flex';
  const emailEl = document.getElementById('adminUserEmail');
  if (emailEl) emailEl.textContent = user.email || '';

  renderDashboard();
});
</script>
</body>
</html>
