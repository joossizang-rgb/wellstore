<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | Wellscore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
<style>
/* =================================================================
   Wellscore — NAD+ 자가검사 웰니스 서비스
   피 한 방울(DBS)로 확인하는 세포 에너지 지표, NAD+.
   디자인 톤: 애플 제품 페이지의 절제된 여백과 타이포그래피 +
   혈액검사라는 소재에서 가져온 레드-앰버 액센트.
   ================================================================= */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  /* ---- Color ---- */
  --bg: #ffffff;
  --bg-soft: #f5f5f7;
  --bg-dark: #1d1d1f;
  --bg-dark-raised: #2a2a2d;

  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --text-on-dark: #f5f5f7;
  --text-on-dark-secondary: #a1a1a6;

  --border: #d2d2d7;
  --border-light: #e8e8ed;
  --border-on-dark: #424245;

  --red: #e8384f;
  --red-dark: #c92a3f;
  --red-tint: #fdeced;

  --amber: #ffb238;
  --amber-dark: #c8790a;
  --amber-tint: #fff4e0;

  --green: #2fb350;
  --green-tint: #e9f8ec;

  /* ---- Type ---- */
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* ---- Shape ---- */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 26px;
  --r-full: 999px;

  /* ---- Elevation ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,.10);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.16);

  --max: 1160px;
  --nav-h: 64px;
  --ease: cubic-bezier(.22,1,.36,1);
}

/* ---------------------------------- Reset ---------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  padding-top: var(--nav-h);
  overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.03em; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------------------------------- Layout ---------------------------------- */
.container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.section { padding: 128px 0; }
.section-soft { background: var(--bg-soft); }
.section-dark { background: var(--bg-dark); color: var(--text-on-dark); }
.section-tight { padding: 72px 0; }

.section-head { max-width: 620px; margin-bottom: 64px; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
h2.section-title {
  font-size: clamp(1.9rem, 1.4rem + 2vw, 2.7rem);
  line-height: 1.2;
  margin-bottom: 18px;
}
.section-desc { font-size: 1.1rem; color: var(--text-secondary); max-width: 46ch; }
.section-dark .section-desc { color: var(--text-on-dark-secondary); }
.section-head.center .section-desc { margin-left: auto; margin-right: auto; }

@media (max-width: 768px) {
  .section { padding: 76px 0; }
  .section-head { margin-bottom: 44px; }
}

/* ---------------------------------- Buttons ---------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 26px;
  border-radius: var(--r-full);
  font-weight: 600; font-size: 1rem;
  transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  white-space: nowrap;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-dark { background: var(--bg-dark); color: #fff; }
.btn-dark:hover { background: #000; transform: translateY(-1px); }
.btn-light { background: #fff; color: var(--text); }
.btn-light:hover { background: var(--bg-soft); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--text); }
.section-dark .btn-outline { color: var(--text-on-dark); border-color: var(--border-on-dark); }
.section-dark .btn-outline:hover { border-color: var(--text-on-dark); }
.panel-dark .btn-outline { color: var(--text-on-dark); border-color: var(--border-on-dark); }
.panel-dark .btn-outline:hover { border-color: var(--text-on-dark); }
.btn-ghost { background: var(--bg-soft); color: var(--text); }
.btn-ghost:hover { background: var(--border-light); }
.btn-lg { padding: 17px 34px; font-size: 1.05rem; }
.btn-sm { padding: 9px 18px; font-size: 0.88rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; }

.text-link { font-weight: 600; color: var(--red); }
.text-link:hover { color: var(--red-dark); }

/* ---------------------------------- Nav ---------------------------------- */
.nav-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-h);
  background: rgba(255,255,255,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
.nav-header.scrolled { border-bottom-color: var(--border-light); }
.nav-container {
  max-width: var(--max); margin: 0 auto; padding: 0 24px; height: 100%;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 1.28rem; font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center; }
.logo::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex-shrink: 0; vertical-align: middle; margin-right: 8px; }
.logo span { color: var(--red); }
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text); }
.nav-links a.active { color: var(--red); }
.nav-links a:hover { color: var(--red); }
.nav-auth { display: flex; align-items: center; gap: 10px; }
.nav-link-plain { font-size: 0.92rem; font-weight: 500; padding: 9px 14px; }

.nav-mobile-toggle {
  display: none; width: 34px; height: 34px; position: relative; z-index: 1100;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.nav-mobile-toggle span {
  display: block; width: 20px; height: 2px; background: var(--text);
  transition: transform .25s var(--ease), opacity .2s ease;
}
.nav-mobile-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-mobile-toggle.active span:nth-child(2) { opacity: 0; }
.nav-mobile-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.nav-mobile-menu {
  display: none;
}

@media (max-width: 860px) {
  .nav-links { display: none; }
  .nav-auth .nav-link-plain, .nav-auth .btn { display: none; }
  .nav-mobile-toggle { display: flex; }
  .nav-mobile-menu {
    display: flex; flex-direction: column;
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
    background: #fff; padding: 12px 24px 40px; z-index: 1001;
    transform: translateY(-8px); opacity: 0; pointer-events: none;
    transition: transform .25s var(--ease), opacity .2s ease;
    overflow-y: auto;
  }
  .nav-mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .nav-mobile-menu a {
    display: block; padding: 16px 4px; font-size: 1.05rem; font-weight: 600;
    border-bottom: 1px solid var(--border-light);
  }
  .nav-mobile-menu .mobile-auth { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
}

/* ---------------------------------- Hero ---------------------------------- */
.hero {
  padding: 100px 0 96px;
  display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center;
}
.hero-copy .kicker { font-size: 1.05rem; font-weight: 600; color: var(--red); margin-bottom: 18px; }
.hero h1 {
  font-size: clamp(2.4rem, 1.7rem + 3vw, 3.75rem);
  line-height: 1.12;
  letter-spacing: -0.035em;
  margin-bottom: 22px;
  opacity: 0; transform: translateY(16px);
  animation: rise .7s var(--ease) forwards;
}
.hero p.lead {
  font-size: 1.2rem; color: var(--text-secondary); max-width: 42ch; margin-bottom: 34px;
  opacity: 0; transform: translateY(16px);
  animation: rise .7s var(--ease) .12s forwards;
}
.hero .btn-row { margin-bottom: 22px; opacity: 0; transform: translateY(16px); animation: rise .7s var(--ease) .24s forwards; }
.hero .fine-print { font-size: .88rem; color: var(--text-tertiary); opacity: 0; animation: rise .7s var(--ease) .34s forwards; }

@keyframes rise { to { opacity: 1; transform: translateY(0); } }

.hero-visual { position: relative; display: flex; align-items: center; justify-content: center; }
.hero-visual svg { width: 100%; max-width: 380px; height: auto; }
.drift-a { animation: drift 5s ease-in-out infinite; }
.drift-b { animation: drift 6.5s ease-in-out infinite .6s; }
.drift-c { animation: drift 5.5s ease-in-out infinite 1.1s; }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding-top: 64px; }
  .hero-copy .lead { margin-left: auto; margin-right: auto; }
  .hero .btn-row { justify-content: center; }
  .hero-visual { order: -1; margin-bottom: 8px; }
  .hero-visual svg { max-width: 260px; }
}

/* ---------------------------------- Feature row (plain, no cards) ---------------------------------- */
.feature-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.feature-item {
  padding: 8px 28px;
  border-left: 1px solid var(--border-light);
}
.feature-item:first-child { border-left: none; padding-left: 0; }
.feature-item .icon { color: var(--red); margin-bottom: 18px; }
.feature-item .icon svg { width: 26px; height: 26px; }
.feature-item h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
.feature-item p { font-size: .94rem; color: var(--text-secondary); }

@media (max-width: 860px) {
  .feature-row { grid-template-columns: 1fr 1fr; row-gap: 36px; }
  .feature-item:nth-child(3) { border-left: none; padding-left: 0; }
}
@media (max-width: 520px) {
  .feature-row { grid-template-columns: 1fr; }
  .feature-item { border-left: none; padding-left: 0; }
}

/* ---------------------------------- Two column content ---------------------------------- */
.split {
  display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center;
}
.split.reverse .split-visual { order: 2; }
.split p { color: var(--text-secondary); font-size: 1.06rem; margin-bottom: 20px; max-width: 50ch; }
.check-list { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.check-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 1rem; }
.check-list .icon { color: var(--green); flex-shrink: 0; margin-top: 2px; }
.check-list .icon svg { width: 20px; height: 20px; }

.split-visual { display: flex; justify-content: center; }
.split-visual svg { width: 100%; max-width: 340px; }

@media (max-width: 860px) {
  .split, .split.reverse { grid-template-columns: 1fr; gap: 40px; }
  .split.reverse .split-visual { order: -1; }
}

/* ---------------------------------- Steps (genuine sequence) ---------------------------------- */
.steps {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative;
}
.steps::before {
  content: ''; position: absolute; top: 23px; left: 60px; right: 60px; height: 1px;
  background: var(--border);
}
.step { position: relative; padding-right: 20px; }
.step .num {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--bg-dark); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.05rem; margin-bottom: 22px; position: relative; z-index: 1;
}
.step h3 { font-size: 1.08rem; margin-bottom: 8px; letter-spacing: -0.01em; }
.step p { font-size: .94rem; color: var(--text-secondary); }

@media (max-width: 860px) {
  .steps { grid-template-columns: 1fr; gap: 32px; }
  .steps::before { display: none; }
}

/* ---------------------------------- Report showcase (dark, the one bold moment) ---------------------------------- */
.showcase {
  display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;
}
.showcase-copy p { color: var(--text-on-dark-secondary); font-size: 1.08rem; max-width: 48ch; margin-bottom: 28px; }
.showcase-note { font-size: .85rem; color: var(--text-tertiary); margin-top: 18px; }

.gauge-card {
  background: var(--bg-dark-raised);
  border: 1px solid var(--border-on-dark);
  border-radius: var(--r-lg);
  padding: 40px 32px 32px;
}
.gauge-card .badge { margin-bottom: 20px; }
.gauge-wrap { display: flex; justify-content: center; margin-bottom: 4px; }
.gauge-wrap svg { width: 100%; max-width: 300px; }
.percentile-value { text-align: center; margin-top: 6px; }
.percentile-value .pct-headline { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
.percentile-value .pct-caption { font-size: .92rem; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }
.gauge-card .percentile-value .pct-headline { color: #fff; }
.gauge-card .percentile-value .pct-caption { color: var(--text-on-dark-secondary); }
.percentile-footnote { font-size: .78rem; color: var(--text-tertiary); text-align: center; margin-top: 16px; line-height: 1.6; }
.gauge-card .percentile-footnote { color: var(--text-on-dark-secondary); opacity: .8; }

.notice-box { display: flex; gap: 14px; align-items: flex-start; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px 22px; }
.notice-box .icon { color: var(--text-secondary); flex-shrink: 0; margin-top: 2px; }
.notice-box .icon svg { width: 20px; height: 20px; }
.notice-box p { font-size: .92rem; color: var(--text-secondary); line-height: 1.65; margin: 0; }
.notice-box strong { color: var(--text); font-weight: 700; }

@media (max-width: 860px) {
  .showcase { grid-template-columns: 1fr; gap: 40px; }
}

/* ---------------------------------- Pricing (plain, honest) ---------------------------------- */
.price-block {
  display: grid; grid-template-columns: auto 1fr; gap: 56px; align-items: start;
  padding-top: 8px;
}
.price-tag .original { font-size: 1.2rem; color: var(--text-tertiary); text-decoration: line-through; margin-bottom: 6px; }
.price-tag .amount { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; display:inline-flex; align-items:baseline; gap:12px; }
.price-tag .discount-badge { font-size: .95rem; font-weight: 700; color: var(--red); background: var(--red-tint); padding: 4px 12px; border-radius: var(--r-full); vertical-align: middle; }
.price-tag .per { font-size: 1.05rem; color: var(--text-secondary); margin-top: 10px; }
.price-includes { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.price-includes li { display: flex; gap: 12px; align-items: flex-start; font-size: 1rem; color: var(--text); border-top: 1px solid var(--border-light); padding-top: 16px; }
.price-includes li:first-child { border-top: none; padding-top: 0; }
.price-includes .icon { color: var(--red); flex-shrink: 0; margin-top: 1px; }
.price-includes .icon svg { width: 20px; height: 20px; }
.price-cta { margin-top: 36px; }

@media (max-width: 700px) {
  .price-block { grid-template-columns: 1fr; gap: 28px; }
}

/* ---------------------------------- Coming soon (quiet inline banner) ---------------------------------- */
.coming-soon {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.coming-soon .text h3 { font-size: 1.1rem; margin-bottom: 6px; }
.coming-soon .text p { color: var(--text-secondary); font-size: .95rem; }
.tag {
  display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700;
  background: var(--bg-soft); color: var(--text-tertiary); padding: 5px 12px; border-radius: var(--r-full);
  flex-shrink: 0;
}

/* ---------------------------------- FAQ ---------------------------------- */
.faq-list { border-top: 1px solid var(--border-light); }
.faq-item { border-bottom: 1px solid var(--border-light); }
.faq-question {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 24px 4px; text-align: left; font-size: 1.05rem; font-weight: 600;
}
.faq-question .chev { flex-shrink: 0; color: var(--text-tertiary); transition: transform .25s var(--ease); }
.faq-item.open .faq-question .chev { transform: rotate(180deg); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height .3s var(--ease); }
.faq-item.open .faq-answer { max-height: 240px; }
.faq-answer p { padding: 0 4px 24px; color: var(--text-secondary); font-size: .98rem; max-width: 62ch; }

/* ---------------------------------- Closing CTA ---------------------------------- */
.cta-band { text-align: center; }
.cta-band h2 { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.4rem); margin-bottom: 28px; letter-spacing: -0.03em; }

/* ---------------------------------- Footer ---------------------------------- */
.site-footer { border-top: 1px solid var(--border-light); padding: 64px 0 32px; }
.footer-top { display: grid; grid-template-columns: 1.3fr 2fr; gap: 48px; margin-bottom: 48px; }
.footer-brand p { color: var(--text-secondary); font-size: .95rem; margin-top: 12px; max-width: 32ch; }
.footer-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.footer-col h4 { font-size: .85rem; color: var(--text-tertiary); font-weight: 600; margin-bottom: 16px; }
.footer-col a { display: block; font-size: .92rem; color: var(--text); margin-bottom: 12px; }
.footer-col a:hover { color: var(--red); }
.footer-bottom { border-top: 1px solid var(--border-light); padding-top: 28px; }
.footer-disclaimer { font-size: .82rem; color: var(--text-tertiary); line-height: 1.7; max-width: 80ch; margin-bottom: 16px; }
.footer-copy { font-size: .82rem; color: var(--text-tertiary); }

@media (max-width: 700px) {
  .footer-top { grid-template-columns: 1fr; gap: 32px; }
  .footer-links { grid-template-columns: repeat(3, 1fr); gap: 16px; }
}

/* =================================================================
   Auth pages (signup / login)
   ================================================================= */
.auth-shell {
  min-height: calc(100vh - var(--nav-h));
  display: flex; align-items: center; justify-content: center;
  padding: 56px 24px;
  background: var(--bg-soft);
}
.auth-card {
  width: 100%; max-width: 420px; background: #fff;
  border-radius: var(--r-lg); padding: 44px 36px;
  box-shadow: var(--shadow-md);
}
.auth-card .logo { display: block; text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
.auth-card h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
.auth-card .sub { text-align: center; color: var(--text-secondary); font-size: .95rem; margin-bottom: 32px; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 8px; }
.field input, .field textarea {
  width: 100%; padding: 13px 15px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: .98rem; transition: border-color .15s ease;
  background: #fff;
}
.field input:focus, .field textarea:focus { border-color: var(--text); outline: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-hint { font-size: .8rem; color: var(--text-tertiary); margin-top: 6px; }

.checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; }
.checkbox-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--red); flex-shrink: 0; }
.checkbox-row label { font-size: .9rem; color: var(--text-secondary); }

.form-error {
  display: none; background: var(--red-tint); color: var(--red-dark);
  font-size: .88rem; font-weight: 500; padding: 12px 14px; border-radius: var(--r-sm); margin-bottom: 18px;
}
.form-note { text-align: center; font-size: .9rem; color: var(--text-secondary); margin-top: 22px; }
.auth-divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
.auth-divider span { font-size: .82rem; color: var(--text-tertiary); }

/* ---------------------------------- Address search row ---------------------------------- */

/* Toast */
.toast {

/* =================================================================

.store-shell { padding: 64px 0 100px; }

.checkout-shell { max-width: 560px; margin: 0 auto; padding: 72px 24px 100px; }

.order-summary .row { display: flex; justify-content: space-between; padding: 12px 0; font-size: .96rem; }

}

@media (max-width: 860px) {

<body>

<header class="nav-header" id="navHeader">
  <div class="nav-container">

    <nav class="nav-links">
      <a href="about-nad.html">NAD+ 검사란</a>
      <a href="store.html">구매하기</a>

</header>

  <a href="about-nad.html">NAD+ 검사란</a>

</div>


<main>
  <div class="notfound">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소를 다시 확인하시거나, 홈으로 돌아가주세요.</p>
    <a href="index.html" class="btn btn-primary">홈으로 돌아가기</a>
  </div>
</main>

<script>
/* =================================================================
   main.js — 모든 페이지 공통 스크립트
   - 로컬스토리지 기반 모의 DB (회원/검사권/구매/신청 내역)
   - 네비게이션 로그인 상태 표시, 모바일 메뉴, FAQ 아코디언
   주의: 실제 서비스 전환 시 아래 DB 함수들은 실서버 API 호출로 교체 필요
   ================================================================= */

const DB_PREFIX = 'wellscore_';

/* ---------- 회원 ---------- */
function getUsers() {
  return JSON.parse(localStorage.getItem(DB_PREFIX + 'users') || '[]');
}
function saveUsers(users) {
  localStorage.setItem(DB_PREFIX + 'users', JSON.stringify(users));
}
function getSession() {
  return localStorage.getItem(DB_PREFIX + 'session');
}
function setSession(email) {
  localStorage.setItem(DB_PREFIX + 'session', email);
}
function clearSession() {
  localStorage.removeItem(DB_PREFIX + 'session');
}
function getCurrentUser() {
  const email = getSession();
  if (!email) return null;
  return getUsers().find(u => u.email === email) || null;
}

/* ---------- 검사권 ---------- */
function getVouchers(email) {
  return parseInt(localStorage.getItem(DB_PREFIX + 'vouchers_' + email) || '0', 10);
}
function setVouchers(email, count) {
  localStorage.setItem(DB_PREFIX + 'vouchers_' + email, String(count));
}

/* ---------- 구매 내역 ---------- */
function getPurchases(email) {
  return JSON.parse(localStorage.getItem(DB_PREFIX + 'purchases_' + email) || '[]');
}
function addPurchase(email, purchase) {
  const list = getPurchases(email);
  list.unshift(purchase);
  localStorage.setItem(DB_PREFIX + 'purchases_' + email, JSON.stringify(list));
}

/* ---------- 키트 신청/검사 내역 ---------- */
function getRequests(email) {
  return JSON.parse(localStorage.getItem(DB_PREFIX + 'requests_' + email) || '[]');
}
function addRequest(email, req) {
  const list = getRequests(email);
  list.unshift(req);
  localStorage.setItem(DB_PREFIX + 'requests_' + email, JSON.stringify(list));
}

/* ---------- 유틸 ---------- */
function formatDate(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}
function genId() {
  return 'NAD' + Date.now().toString(36).toUpperCase();
}
function daysAgoISO(days) {
  return new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString();
}

/* ---------- 네비게이션 로그인 상태 ---------- */
function renderNavAuth() {
  const user = getCurrentUser();
  const targets = [document.getElementById('navAuth'), document.getElementById('navAuthMobile')];
  const html = user
    ? `<a href="mypage.html" class="btn btn-ghost btn-sm">마이페이지</a><button type="button" class="btn btn-outline btn-sm" onclick="handleLogout()">로그아웃</button>`
    : `<a href="login.html" class="nav-link-plain">로그인</a><a href="signup.html" class="btn btn-dark btn-sm">회원가입</a>`;
  targets.forEach(el => { if (el) el.innerHTML = html; });
}
function handleLogout() {
  clearSession();
  window.location.href = 'index.html';
}

/* ---------- 모바일 메뉴 ---------- */
function initMobileMenu() {
  const toggle = document.getElementById('navMobileToggle');
  const menu = document.getElementById('navMobileMenu');
  if (!toggle || !menu) return;
  toggle.addEventListener('click', () => {
    menu.classList.toggle('open');
    toggle.classList.toggle('active');
  });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    menu.classList.remove('open');
    toggle.classList.remove('active');
  }));
}

/* ---------- 네비게이션 스크롤 상태 ---------- */
function initNavScroll() {
  const nav = document.getElementById('navHeader');
  if (!nav) return;
  const update = () => { nav.classList.toggle('scrolled', window.scrollY > 6); };
  window.addEventListener('scroll', update, { passive: true });
  update();
}

/* ---------- FAQ 아코디언 ---------- */
function initFAQ() {
  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-question');
    if (!q) return;
    q.addEventListener('click', () => {
      const parent = item.parentElement;
      const wasOpen = item.classList.contains('open');
      parent.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    });
  });
}

/* ---------- 토스트 ---------- */
function showToast(msg) {
  const toast = document.getElementById('toast');
  const textEl = document.getElementById('toastText');
  if (!toast || !textEl) return;
  textEl.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3800);
}


/* ---------- 다음 우편번호 검색 (회원가입, 키트 신청에서 공통 사용) ---------- */
function execDaumPostcode() {
  if (typeof daum === 'undefined') {
    alert('주소 검색 서비스를 불러오지 못했어요. 네트워크 연결을 확인해주세요.');
    return;
  }
  new daum.Postcode({
    oncomplete: function (data) {
      document.getElementById('zonecode').value = data.zonecode;
      document.getElementById('address').value = data.roadAddress || data.jibunAddress;
      document.getElementById('addressDetail').focus();
    }
  }).open();
}

/* ---------- 나이대 계산 (생년월일 기반) ---------- */
function getAgeGroup(birthdateStr) {
  if (!birthdateStr) return '30대';
  const birth = new Date(birthdateStr);
  if (isNaN(birth.getTime())) return '30대';
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  let decade = Math.floor(age / 10) * 10;
  if (decade < 20) return '20대 미만';
  if (decade >= 70) return '70대 이상';
  return decade + '대';
}

/* ---------- 데모 계정으로 빠르게 둘러보기 ---------- */
function quickDemoLogin() {
  const demoEmail = 'demo@wellscore.example';
  const users = getUsers();
  let demoUser = users.find(u => u.email === demoEmail);
  if (!demoUser) {
    demoUser = {
      name: '데모', email: demoEmail, phone: '010-0000-0000',
      birthdate: '1993-05-14', gender: '여성',
      zonecode: '06236', address: '서울특별시 강남구 테헤란로 123', addressDetail: '4층',
      password: 'demo1234', createdAt: new Date().toISOString()
    };
    users.push(demoUser);
    saveUsers(users);
    setVouchers(demoEmail, 1);
    addPurchase(demoEmail, { id: genId(), date: daysAgoISO(30), qty: 1, amount: 30000 });
    addRequest(demoEmail, {
      id: genId(), date: daysAgoISO(20), status: '완료',
      recipientName: '데모', recipientPhone: '010-0000-0000',
      zonecode: '06236', address: '서울특별시 강남구 테헤란로 123', addressDetail: '4층'
    });
  }
  setSession(demoEmail);
  window.location.href = 'mypage.html';
}

document.addEventListener('DOMContentLoaded', () => {
  renderNavAuth();
  initMobileMenu();
  initNavScroll();
  initFAQ();
});

</script>
